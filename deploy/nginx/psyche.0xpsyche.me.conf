server {
    listen 80;
    listen [::]:80;

    server_name psyche.0xpsyche.me;
    root /var/www/psyche.0xpsyche.me/current;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name psyche.0xpsyche.me;
    root /var/www/psyche.0xpsyche.me/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/psyche.0xpsyche.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/psyche.0xpsyche.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/psyche.0xpsyche.me.access.log;
    error_log /var/log/nginx/psyche.0xpsyche.me.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        default_type text/plain;
        return 200 "psyche-design-preview\n";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
